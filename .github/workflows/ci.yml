name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/ath-core/Cargo.toml
      - run: pnpm check:public-data
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ath-core-binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path crates/ath-core/Cargo.toml
      - run: cargo test --manifest-path crates/ath-core/Cargo.toml
      - run: node scripts/stage-ath-core.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ath-core-${{ runner.os }}-${{ runner.arch }}
          path: vendor/ath-core
          if-no-files-found: error

  package-smoke:
    needs: ath-core-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: ath-core-*
          path: vendor/ath-core
          merge-multiple: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:schema-drift
      - run: find vendor/ath-core -type f -exec chmod 755 {} +
      - run: node --input-type=module -e "import { existsSync } from 'node:fs'; for (const path of ['linux-x64/ath-core', 'darwin-arm64/ath-core', 'win32-x64/ath-core.exe']) { if (!existsSync('vendor/ath-core/' + path)) throw new Error('missing vendor/ath-core/' + path); }"
      - run: npm pack
      - run: node scripts/assert-packed-binary.mjs "athleticstandard-$(node -p "require('./package.json').version").tgz"
      - run: node scripts/smoke-installed-package.mjs

  mapping-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/mapping-path.test.ts

  # The native rebuild (build-history/v2.1.1/spec.md). It runs beside the 2.1.0
  # checks until the cutover replaces them.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml in native/ pins the compiler; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Report every failing test program, not only the first.
      - run: cargo test --locked --no-fail-fast

  # The npm package (build-history/v2.1.1/spec.md sections 11.2, 11.3, 13.2, 15).
  # Each release executable is built once, here. Every later job uses these
  # exact files: the tarball packs them, and the tests run them.
  native-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            executable: ath
          - os: macos-latest
            target: darwin-arm64
            executable: ath
          - os: windows-latest
            target: win32-x64
            executable: ath.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: native
      - run: cargo build --release --locked
        working-directory: native
      - name: Check the executable reports the package version
        shell: bash
        run: |
          expected="$(node -p "require('./packages/npm/package.json').version")"
          actual="$(native/target/release/${{ matrix.executable }} --version)"
          if [ "$actual" != "$expected" ]; then
            echo "ath --version printed '$actual'; package.json has '$expected'"
            exit 1
          fi
      - name: Stage the executable as native-artifact/<target>/<file>
        shell: bash
        run: |
          mkdir -p native-artifact/${{ matrix.target }}
          cp native/target/release/${{ matrix.executable }} native-artifact/${{ matrix.target }}/
          node -e "const fs = require('fs'); const file = process.argv[1]; console.log(require('crypto').createHash('sha256').update(fs.readFileSync(file)).digest('hex') + '  ' + file)" native-artifact/${{ matrix.target }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-artifact
          if-no-files-found: error

  # Packs the three executables above without building anything. The download
  # gives pack.mjs its required layout: native-artifacts/linux-x64/ath,
  # native-artifacts/darwin-arm64/ath, and native-artifacts/win32-x64/ath.exe.
  npm-pack:
    needs: native-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true
      - run: node packages/npm/scripts/pack.mjs --native-dir native-artifacts --out npm-tarball
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: npm-tarball
          if-no-files-found: error

  # The type check and the client and launcher tests, against the Linux
  # executable from native-release.
  npm-client:
    needs: native-release
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    env:
      ATH_NATIVE_EXECUTABLE: ${{ github.workspace }}/native-artifacts/linux-x64/ath
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native-artifacts
      - run: chmod 755 "$ATH_NATIVE_EXECUTABLE"
      - run: node ../../node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
        working-directory: packages/npm
      - run: node ../../node_modules/vitest/vitest.mjs run
        working-directory: packages/npm

  # The launcher tests on Windows: package-manager lookup with PATHEXT, a real
  # batch file run through cmd.exe, and the Windows executable through the launcher.
  npm-launcher-windows:
    needs: native-release
    runs-on: windows-latest
    env:
      ATH_NATIVE_EXECUTABLE: ${{ github.workspace }}\native-artifacts\win32-x64\ath.exe
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: native-artifacts
      - run: node ../../node_modules/vitest/vitest.mjs run test/launcher.test.ts
        working-directory: packages/npm

  # Each system installs the same packed tarball into an empty folder. Only the
  # smoke scripts are checked out; the source tree and build tools stay out of reach.
  npm-smoke:
    needs: npm-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packages/npm/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: npm-tarball
      - name: Install and use the packed tarball
        shell: bash
        run: node packages/npm/scripts/smoke.mjs npm-tarball/athleticstandard-*.tgz
