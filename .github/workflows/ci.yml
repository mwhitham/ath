name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/ath-core/Cargo.toml
      - run: pnpm check:public-data
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ath-core-binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path crates/ath-core/Cargo.toml
      - run: cargo test --manifest-path crates/ath-core/Cargo.toml
      - run: node scripts/stage-ath-core.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ath-core-${{ runner.os }}-${{ runner.arch }}
          path: vendor/ath-core
          if-no-files-found: error

  package-smoke:
    needs: ath-core-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: ath-core-*
          path: vendor/ath-core
          merge-multiple: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:schema-drift
      - run: find vendor/ath-core -type f -exec chmod 755 {} +
      - run: node --input-type=module -e "import { existsSync } from 'node:fs'; for (const path of ['linux-x64/ath-core', 'darwin-arm64/ath-core', 'win32-x64/ath-core.exe']) { if (!existsSync('vendor/ath-core/' + path)) throw new Error('missing vendor/ath-core/' + path); }"
      - run: npm pack
      - run: node scripts/assert-packed-binary.mjs "athleticstandard-$(node -p "require('./package.json').version").tgz"
      - run: node scripts/smoke-installed-package.mjs

  mapping-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/mapping-path.test.ts
