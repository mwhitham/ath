# Every pull request and every push to main runs the release checks in
# validate.yml: formatting, Clippy, and the Rust tests on Linux, macOS, and
# Windows; release builds and archive smoke tests on the three systems; the
# npm client tests on Node 22 and 24; and the npm tarball, packed from the
# tested executables and installed on the three systems.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
