# The quick check (D225). It runs on every pull request push and on every push
# to main:
#
# - Linux: formatting, Clippy, every Rust test (including the public-data and
#   generated-file checks), then the npm client tests on Node 24.
# - macOS: Clippy and every Rust test (D226).
# - Windows: Clippy and every Rust test, plus the real Credential Manager test.
#
# The `checks passed` job is the one check the main branch rules require, so
# renaming or adding jobs here never strands those rules. The full check on
# Linux, macOS, and Windows, with release builds and install checks, runs when
# a release is made (release-cross-platform.yml), or by hand.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Report every failing test program, not only the first.
      - run: cargo test --locked --no-fail-fast
      # The npm tests run the executable at target/debug/ath.
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - name: npm client
        working-directory: packages/npm
        run: |
          npm ci
          npm run typecheck
          npm test

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # The real Credential Manager, under a test service name. The test is
      # ignored elsewhere because it writes to the password store of whoever
      # runs it; this runner is discarded after the job.
      - name: Credential Manager on the Windows runner
        run: cargo test --locked --test runtime_keyring -- --ignored credential_manager_saves_reads_and_clears_a_key_on_windows

  checks-passed:
    name: checks passed
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the Linux, macOS, and Windows checks to pass
        run: |
          echo "linux: ${{ needs.linux.result }}, macos: ${{ needs.macos.result }}, windows: ${{ needs.windows.result }}"
          test "${{ needs.linux.result }}" = success
          test "${{ needs.macos.result }}" = success
          test "${{ needs.windows.result }}" = success
