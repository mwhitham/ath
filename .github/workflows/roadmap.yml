# Keeps the public Roadmap project in step with issues labeled roadmap.
# GitHub's workflow token cannot create a project on a personal account.
# Add the repository owner's personal access token as ROADMAP_PROJECT_TOKEN,
# then run this workflow from the Actions tab.

name: Roadmap

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled, closed, reopened]

permissions:
  contents: read

jobs:
  ensure-board:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the label, project, and columns
        env:
          ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
          ROADMAP_PROJECT_NUMBER: "3"
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/roadmap-board.ts ensure

  sync-item:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move the card
        env:
          ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
          ROADMAP_PROJECT_NUMBER: "3"
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/roadmap-board.ts sync
