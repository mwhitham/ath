# Releases (D225, D251, D252). A release runs the full check in validate.yml
# on Linux, macOS, and Windows: every Rust test, release builds, archive smoke
# tests, and the npm tarball packed from the tested executables and installed
# on each system. Then it checks that the archives and the tarball hold the
# same executables, and releases only those checked files. Nothing is rebuilt
# after testing.
#
# A release starts in one of three ways:
# - the maintainer comments `/release` on a merged pull request, and
#   release-commands.yml starts this workflow on `main` with `publish` set;
# - Actions > Release cross-platform > Run workflow on `main`, with `publish`
#   set, from the website or GitHub Mobile;
# - pushing a version tag, such as v2.1.2.
# A release from `main` tags the tested commit with the version in
# packages/npm/package.json, after every check has passed.
#
# The tarball is staged on npm, not published (D251). npm's trusted publishing
# lets this job stage it with a short-lived identity token from GitHub, so no
# npm token is stored. The package goes public only when the maintainer
# approves it on npmjs.com or with `npm stage approve`, which needs their
# two-factor code. The archives become the GitHub release. The last job
# comments on the merged pull request with the result.
#
# Run workflow without `publish`, on any branch, runs the full check only. The
# speed comparison is separate and runs by hand (release-performance.yml).
name: Release cross-platform

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release after the full check (from main or a version tag)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packages/npm/package.json
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          # The commit a tag names, or nothing when there is no such tag.
          # `gh api` prints GitHub's "Not Found" body on standard output for a
          # missing ref, so `git/ref/tags/<tag>` cannot tell "no tag" from a tag.
          # The matching-refs list is empty instead. Any other failure stops the
          # step: `|| return 1` passes the failure out of `$(...)`, where
          # `bash -e` does not apply, so an outage is never read as "no tag".
          tag_commit() {
            local found type sha
            found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$1" \
              --jq ".[] | select(.ref == \"refs/tags/$1\") | .object | \"\\(.type) \\(.sha)\"")" || return 1
            [ -n "$found" ] || return 0
            type="${found%% *}"
            sha="${found#* }"
            if [ "$type" = tag ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha
            else
              printf '%s\n' "$sha"
            fi
          }
          version="$(node -p "require('./packages/npm/package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Full check only; nothing will be released."
            exit 0
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packages/npm/package.json has version $version, which is not X.Y.Z."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not name version $version."
              exit 1
            fi
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            existing="$(tag_commit "$tag")"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names commit $existing. Raise the version in packages/npm/package.json to release $GITHUB_SHA."
              exit 1
            fi
          else
            echo "::error::A release starts only from main or a version tag, not $GITHUB_REF."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA after the full check."

  validate:
    needs: version
    uses: ./.github/workflows/validate.yml

  publish:
    name: Stage on npm and create the GitHub release
    needs: [version, validate]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use an npm that can stage through trusted publishing
        run: npm install -g npm@12 && npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: npm-tarball
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Check the archives and the tarball agree
        run: |
          version="${TAG#v}"
          mkdir unpacked
          for archive in archives/*.tar.gz; do tar -C unpacked -xzf "$archive"; done
          for archive in archives/*.zip; do (cd unpacked && unzip -q "../$archive"); done
          VERSION="$version" node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const version = process.env.VERSION;
          const triples = {
            "linux-x64": ["x86_64-unknown-linux-gnu", "ath"],
            "darwin-arm64": ["aarch64-apple-darwin", "ath"],
            "win32-x64": ["x86_64-pc-windows-msvc", "ath.exe"],
          };
          const summary = JSON.parse(readFileSync("npm-tarball/pack-summary.json", "utf8"));
          if (summary.package !== `athleticstandard@${version}` || summary.missing_targets.length > 0) {
            throw new Error(`the tarball is ${summary.package} and lacks ${summary.missing_targets.join(", ")}`);
          }
          for (const native of summary.native) {
            const [triple, executable] = triples[native.target];
            const file = `unpacked/ath-${version}-${triple}/${executable}`;
            const sha256 = createHash("sha256").update(readFileSync(file)).digest("hex");
            if (sha256 !== native.sha256) {
              throw new Error(`${file} is ${sha256}; the tarball's ${native.path} is ${native.sha256}`);
            }
            console.log(`${sha256}  ${native.target}: archive and tarball agree`);
          }
          EOF
          (cd archives && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Tag the tested commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit a tag names, or nothing when there is no such tag.
          # `gh api` prints GitHub's "Not Found" body on standard output for a
          # missing ref, so `git/ref/tags/<tag>` cannot tell "no tag" from a tag.
          # The matching-refs list is empty instead. Any other failure stops the
          # step: `|| return 1` passes the failure out of `$(...)`, where
          # `bash -e` does not apply, so an outage is never read as "no tag".
          tag_commit() {
            local found type sha
            found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$1" \
              --jq ".[] | select(.ref == \"refs/tags/$1\") | .object | \"\\(.type) \\(.sha)\"")" || return 1
            [ -n "$found" ] || return 0
            type="${found%% *}"
            sha="${found#* }"
            if [ "$type" = tag ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha
            else
              printf '%s\n' "$sha"
            fi
          }
          existing="$(tag_commit "$TAG")"
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            echo "Tagged $GITHUB_SHA as $TAG."
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already names commit $existing."
            exit 1
          fi
      - name: Stage the checked tarball on npm for the maintainer to approve
        run: npm stage publish "npm-tarball/$(node -p "require('./npm-tarball/pack-summary.json').tarball")"
      - name: Publish the checked archives as the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" archives/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"

  report:
    name: Report on the pull request
    needs: [version, validate, publish]
    # Also when deciding failed, before `release` was set, so a refused
    # release is reported too. A run with `publish` off never fails there.
    if: always() && (needs.version.outputs.release == 'true' || needs.version.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment with the result and the approval steps
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No merged pull request contains $GITHUB_SHA, so there is nowhere to comment."
            exit 0
          fi
          if [ "$RESULT" = success ]; then
            IFS= read -r -d '' body <<'EOF' || true
          **@TAG@ is staged on npm and waiting for your approval.**

          The full check passed. `@TAG@` now names the tested commit, and the [GitHub release](@SERVER@/@REPO@/releases/tag/@TAG@) holds the native archives. Nobody can install @TAG@ from npm until you approve it.

          Approve it in one of two ways. Both ask for your two-factor code.

          - **On npmjs.com:** sign in, open [athleticstandard](https://www.npmjs.com/package/athleticstandard), and approve the staged version.
          - **In a terminal:** `npm stage list athleticstandard`, then `npm stage approve <stage-id>`.

          Then check it from any folder: `npx -y athleticstandard@@VERSION@ --version`

          [Release run](@RUN@)
          EOF
          else
            IFS= read -r -d '' body <<'EOF' || true
          **The release of @TAG@ did not finish.** Nothing is public on npm.

          Open the [release run](@RUN@) to see which step failed. Fix it in a new pull request, merge it, and comment `/release` on that pull request.
          EOF
          fi
          body="${body//@TAG@/$TAG}"
          body="${body//@VERSION@/${TAG#v}}"
          body="${body//@RUN@/$RUN_URL}"
          body="${body//@SERVER@/$GITHUB_SERVER_URL}"
          body="${body//@REPO@/$GITHUB_REPOSITORY}"
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
