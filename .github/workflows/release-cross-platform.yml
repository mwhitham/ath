# Releases (D225). Pushing a version tag, such as v2.1.1, runs the full check
# in validate.yml on Linux, macOS, and Windows: every Rust test, release
# builds, archive smoke tests, and the npm tarball packed from the tested
# executables and installed on each system. Then it checks that the archives
# and the tarball hold the same executables, and publishes only those checked
# files: the tarball to npm and the archives as the GitHub release. Nothing is
# rebuilt after testing.
#
# The tarball is staged on npm, not published (D251). npm's trusted publishing
# lets this job stage it with a short-lived identity token from GitHub, so no
# npm token is stored. The package goes public only when the maintainer
# approves it on npmjs.com or with `npm stage approve`, which needs their
# two-factor code.
#
# A manual run (Actions > Release cross-platform > Run workflow) runs the same
# full check on any branch. It publishes only when it starts from a version
# tag with `publish` set. The speed comparison is separate and runs by hand
# (release-performance.yml).
name: Release cross-platform

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked npm tarball and native archives (the run must start from a version tag)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packages/npm/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use an npm that can stage through trusted publishing
        run: npm install -g npm@12 && npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: npm-tarball
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Check the tag, the archives, and the tarball agree
        run: |
          version="$(node -p "require('./packages/npm/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name version $version"
            exit 1
          fi
          mkdir unpacked
          for archive in archives/*.tar.gz; do tar -C unpacked -xzf "$archive"; done
          for archive in archives/*.zip; do (cd unpacked && unzip -q "../$archive"); done
          VERSION="$version" node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const version = process.env.VERSION;
          const triples = {
            "linux-x64": ["x86_64-unknown-linux-gnu", "ath"],
            "darwin-arm64": ["aarch64-apple-darwin", "ath"],
            "win32-x64": ["x86_64-pc-windows-msvc", "ath.exe"],
          };
          const summary = JSON.parse(readFileSync("npm-tarball/pack-summary.json", "utf8"));
          if (summary.package !== `athleticstandard@${version}` || summary.missing_targets.length > 0) {
            throw new Error(`the tarball is ${summary.package} and lacks ${summary.missing_targets.join(", ")}`);
          }
          for (const native of summary.native) {
            const [triple, executable] = triples[native.target];
            const file = `unpacked/ath-${version}-${triple}/${executable}`;
            const sha256 = createHash("sha256").update(readFileSync(file)).digest("hex");
            if (sha256 !== native.sha256) {
              throw new Error(`${file} is ${sha256}; the tarball's ${native.path} is ${native.sha256}`);
            }
            console.log(`${sha256}  ${native.target}: archive and tarball agree`);
          }
          EOF
          (cd archives && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Stage the checked tarball on npm for the maintainer to approve
        run: npm stage publish "npm-tarball/$(node -p "require('./npm-tarball/pack-summary.json').tarball")"
      - name: Publish the checked archives as the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
