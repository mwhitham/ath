# Releases (build-history/v2.1.1/spec.md section 15).
#
# A pull request that changes a release file runs the validation jobs in
# validate.yml, with no publication credential. A version tag, or a manual run
# from a tag with `publish` set, reuses those same jobs. It then requires the
# performance results that release-performance.yml made on the same commit,
# checks that the archives and the npm tarball hold the same executables, and
# publishes only those checked files. Nothing is rebuilt after testing.
name: Release cross-platform

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked npm tarball and native archives (the run must start from a version tag)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-cross-platform.yml
      - .github/workflows/validate.yml
      - packages/npm/scripts/**
      - tools/archive-smoke.sh
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # The release consumes the performance results made on this exact commit.
  # A missing, failed, or older run stops the release.
  performance-evidence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the performance results for this commit
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-performance.yml \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful release-performance run exists for $GITHUB_SHA. Run that workflow on this commit first."
            exit 1
          fi
          for size in 100k 3m; do
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "performance-$size" --dir "performance-evidence/$size"
            recorded="$(cat "performance-evidence/$size/commit.txt")"
            if [ "$recorded" != "$GITHUB_SHA" ]; then
              echo "performance-$size was measured on $recorded, not $GITHUB_SHA"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-performance-evidence
          path: performance-evidence
          if-no-files-found: error

  publish:
    needs: [validate, performance-evidence]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packages/npm/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: npm-tarball
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Check the tag, the archives, and the tarball agree
        run: |
          version="$(node -p "require('./packages/npm/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name version $version"
            exit 1
          fi
          mkdir unpacked
          for archive in archives/*.tar.gz; do tar -C unpacked -xzf "$archive"; done
          for archive in archives/*.zip; do (cd unpacked && unzip -q "../$archive"); done
          VERSION="$version" node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const version = process.env.VERSION;
          const triples = {
            "linux-x64": ["x86_64-unknown-linux-gnu", "ath"],
            "darwin-arm64": ["aarch64-apple-darwin", "ath"],
            "win32-x64": ["x86_64-pc-windows-msvc", "ath.exe"],
          };
          const summary = JSON.parse(readFileSync("npm-tarball/pack-summary.json", "utf8"));
          if (summary.package !== `athleticstandard@${version}` || summary.missing_targets.length > 0) {
            throw new Error(`the tarball is ${summary.package} and lacks ${summary.missing_targets.join(", ")}`);
          }
          for (const native of summary.native) {
            const [triple, executable] = triples[native.target];
            const file = `unpacked/ath-${version}-${triple}/${executable}`;
            const sha256 = createHash("sha256").update(readFileSync(file)).digest("hex");
            if (sha256 !== native.sha256) {
              throw new Error(`${file} is ${sha256}; the tarball's ${native.path} is ${native.sha256}`);
            }
            console.log(`${sha256}  ${native.target}: archive and tarball agree`);
          }
          EOF
          (cd archives && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the checked tarball to npm
        run: npm publish "npm-tarball/$(node -p "require('./npm-tarball/pack-summary.json').tarball")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish the checked archives as the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
