name: Release performance

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.0-*"

permissions:
  contents: read

jobs:
  functional-and-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: >-
          pnpm performance:generate -- --records 100000
          --output performance/generated/100k
      - run: >-
          pnpm performance:run --
          --database performance/generated/100k/athlete.ath.sqlite
          --output performance/results/100k.json
          --measured-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --repetitions 3
      - uses: actions/upload-artifact@v4
        with:
          name: performance-100k
          path: performance/results/100k.json

  three-million:
    runs-on: [self-hosted, linux, x64, ath-performance]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm performance:generate -- --records 3000000
          --output performance/generated/3m
      - run: >-
          pnpm performance:run --
          --database performance/generated/3m/athlete.ath.sqlite
          --output performance/results/3m.json
          --measured-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --repetitions 3
      - uses: actions/upload-artifact@v4
        with:
          name: performance-3m
          path: performance/results/3m.json
