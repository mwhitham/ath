[package]
name = "ath-node"
version = "0.1.0"
edition = "2021"
description = "napi-rs bindings to ath-core"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ath-core = { path = "../ath-core" }
napi = { version = "2.14", default-features = false, features = ["napi4"] }
napi-derive = "2.14"

[build-dependencies]
napi-build = "2.4"
