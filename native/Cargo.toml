[package]
name = "athleticstandard"
version = "2.1.1"
edition = "2021"
rust-version = "1.95"
description = "Athletic Standard: a local-first SQLite record of an athlete's training and recovery data"
license = "MIT"
publish = false

[lib]
name = "athleticstandard"
path = "src/lib.rs"

[[bin]]
name = "ath"
path = "src/main.rs"

# Native library latency for the release performance report. See
# tools/performance/README.md.
[[example]]
name = "performance-library"
path = "tools/performance/library.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
quick-xml = "0.37"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
terminal_size = "0.4.4"
ureq = "2.12"
uuid = { version = "1.29", features = ["v7"] }
zip = "2.2"

[profile.release]
lto = "thin"
codegen-units = 4

[dev-dependencies]
tempfile = "3.27.0"
