[package]
name = "athleticstandard-host"
version = "2.1.3"
edition = "2021"
rust-version = "1.95"
description = "ath-host: an optional program that serves many athletes' Athletic Standard records over HTTPS"
license = "MIT"
publish = false

[[bin]]
name = "ath-host"
path = "src/main.rs"

[lib]
name = "ath_host"
path = "src/lib.rs"

[dependencies]
athleticstandard = { path = "..", features = ["changesets"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
libsql = { version = "0.10.0", default-features = false, features = ["remote", "tls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rusty-s3 = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
ureq = { version = "2.12", features = ["json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
zip = "2.2"

[dev-dependencies]
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
